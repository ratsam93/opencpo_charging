services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocpp}
      POSTGRES_USER: ${POSTGRES_USER:-ocpp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run configure.py or edit .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocpp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Core CSMS ─────────────────────────────────────────────────────────────

  ocpp-core:
    build: ./opencpo-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${OCPP_16_WS_PORT:-9100}:9100"   # OCPP 1.6 WebSocket
      - "${BIND_ADDR:-127.0.0.1}:${OCPP_201_WS_PORT:-9201}:9201"  # OCPP 2.0.1 WebSocket
      - "${BIND_ADDR:-127.0.0.1}:${OCPP_API_PORT:-8000}:8000"     # REST API
    environment:
      # Database
      PG_HOST: postgres
      PG_PORT: 5432
      PG_NAME: ${POSTGRES_DB:-ocpp}
      PG_USER: ${POSTGRES_USER:-ocpp}
      PG_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run configure.py or edit .env}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # App
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set - run configure.py or edit .env}
      # opencpo-core reads JWT_SECRET (not SECRET_KEY) for account tokens
      JWT_SECRET: ${SECRET_KEY:?SECRET_KEY is not set - run configure.py or edit .env}
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:?MANAGEMENT_API_KEY is not set - run configure.py or edit .env}
      API_KEY: ${MANAGEMENT_API_KEY:?MANAGEMENT_API_KEY is not set - run configure.py or edit .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # Backup / update paths
      UPDATE_SCRIPT: /app/opencpo/update.sh
      BACKUP_DIR: /app/backups
      DB_UTILS: /app/opencpo/scripts/db-utils.sh
      CORE_API_PUBLIC_URL: ${CORE_API_PUBLIC_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 7
      start_period: 45s
    volumes:
      # Read-only helper used by the backup/restore endpoints. No secrets in here.
      - ./scripts:/app/opencpo/scripts:ro
      - backup-data:/app/backups
      # The certificate authority (root CA, sub-CAs and their private keys) lives
      # here. Without a volume it is regenerated whenever the container is
      # recreated, which orphans every certificate issued before.
      - pki-data:/app/data/pki
      # The in-app "update" button needs the Docker socket and the whole repo
      # (including .env) mounted into this container. That is root-equivalent on
      # the host, so it is OFF by default: see docker-compose.updater.yml.

  # ── Operator Dashboard ────────────────────────────────────────────────────

  cpo-admin:
    build: ./opencpo-admin
    restart: unless-stopped
    depends_on:
      ocpp-core:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${CPO_ADMIN_PORT:-8080}:8080"
    environment:
      OCPP_CORE_API: http://ocpp-core:8000
      CORE_API_KEY: ${MANAGEMENT_API_KEY:?MANAGEMENT_API_KEY is not set - run configure.py or edit .env}
      # Core signs admin JWTs with API_KEY, so this must equal MANAGEMENT_API_KEY
      JWT_SECRET: ${MANAGEMENT_API_KEY:?MANAGEMENT_API_KEY is not set - run configure.py or edit .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      ORG_NAME: ${ORG_NAME:-My CPO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Driver PWA ────────────────────────────────────────────────────────────

  charge-app:
    build: ./opencpo-charge-app
    restart: unless-stopped
    depends_on:
      ocpp-core:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${CHARGE_APP_PORT:-8003}:8003"
    environment:
      OCPP_CORE_API: http://ocpp-core:8000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      SKIN: ${SKIN:-default}
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:?MANAGEMENT_API_KEY is not set - run configure.py or edit .env}
      JWT_SECRET: ${SECRET_KEY:?SECRET_KEY is not set - run configure.py or edit .env}

  # ── Compliance Tester ─────────────────────────────────────────────────────

  compliance-tester:
    build: ./opencpo-tester
    # The tester exits after 60 s with no charger connected; do not restart-loop it.
    # Run it on demand:  docker compose run --rm --service-ports compliance-tester
    restart: "no"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${COMPLIANCE_PORT:-8090}:8090"
    # The tester is a CLI + WebSocket listener: chargers connect TO it on this
    # port. It does not dial out to ocpp-core and has no web UI.
    environment:
      PORT: 8090

  # ── Virtual Charger Farm ──────────────────────────────────────────────────

  charger-farm:
    build: ./opencpo-charger-farm
    restart: unless-stopped
    depends_on:
      ocpp-core:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${CHARGER_FARM_PORT:-8087}:8087"
    environment:
      OCPP16_URL: ws://ocpp-core:9100
      OCPP201_URL: ws://ocpp-core:9201
      FARM_UI_PORT: 8087

volumes:
  pgdata:
    driver: local
  backup-data:
    driver: local
  pki-data:
    driver: local
